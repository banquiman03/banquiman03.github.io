<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 | Page Not Found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --page-bg: #1A1A1A;
      --panel-bg: #2C2C2C;
      --border-color: #4F4F4F;
      --accent-color: #4B63FF;
      --text-color: #FFFFFF;
      --muted-text: #D0D0D0;
      --heading-font: "PT Sans", sans-serif;
      --body-font: "DM Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
      background-color: var(--page-bg);
      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px
        );
      background-size: 56px 84px;
      color: var(--text-color);
      font-family: var(--body-font);
    }

    .error-shell {
      width: min(760px, 100%);
      position: relative;
    }

    .error-card {
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 7vw, 68px);
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
    }

    .error-card::before {
      content: "";
      width: 190px;
      height: 190px;
      position: absolute;
      top: -105px;
      right: -80px;
      border: 1px solid rgba(75, 99, 255, 0.34);
      border-radius: 50%;
    }

    .error-card::after {
      content: "";
      width: 120px;
      height: 120px;
      position: absolute;
      bottom: -75px;
      left: -55px;
      background: rgba(75, 99, 255, 0.08);
      border-radius: 50%;
    }

    .error-code {
      margin: 0;
      color: var(--accent-color);
      font-family: var(--heading-font);
      font-size: clamp(88px, 20vw, 156px);
      line-height: 0.85;
      letter-spacing: -7px;
    }

    .error-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 25px;
      padding: 7px 13px;
      border: 1px solid rgba(75, 99, 255, 0.5);
      border-radius: 50px;
      color: #AEB8FF;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    .error-label::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(75, 99, 255, 0.12);
    }

    .error-title {
      margin: 22px 0 10px;
      font-family: var(--heading-font);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
    }

    .error-message {
      max-width: 520px;
      margin: 0 auto;
      color: var(--muted-text);
      font-size: 15px;
      line-height: 1.75;
    }

    .error-actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .home-button {
      width: max-content;
      min-width: 170px;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 13px 20px;
      background: #242424;
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      color: #FFFFFF;
      font-family: var(--body-font);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease;
    }

    .home-button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        110deg,
        var(--accent-color) 0%,
        #6174FF 52%,
        var(--accent-color) 100%
      );
      transform: translateX(-103%);
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .home-button::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -28%;
      width: 26%;
      height: 220%;
      background: rgba(255, 255, 255, 0.18);
      transform: rotate(18deg) translateX(-240%);
      transition: transform 0.6s ease;
      pointer-events: none;
    }

    .home-button i {
      font-size: 17px;
      line-height: 1;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .home-button:hover {
      transform: translateY(-2px);
      border-color: #7182FF;
    }

    .home-button:hover::before {
      transform: translateX(0);
    }

    .home-button:hover::after {
      transform: rotate(18deg) translateX(620%);
    }

    .home-button:hover i {
      transform: translate(3px, -3px);
    }

    .home-button:active {
      transform: translateY(0) scale(0.98);
    }

    .home-button:focus-visible {
      outline: 2px solid #FFFFFF;
      outline-offset: 3px;
    }

    @media (max-width: 576px) {
      body {
        padding: 18px;
      }

      .error-card {
        border-radius: 14px;
      }

      .error-code {
        letter-spacing: -4px;
      }

      .home-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .home-button,
      .home-button::before,
      .home-button::after,
      .home-button i {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      const routes = [
        'about',
        'resume',
        'portfolio',
        'contact'
      ];

      const parts =
        window.location.pathname
          .split('/')
          .filter(Boolean);

      const page =
        parts[
          parts.length - 1
        ];

      if (
        routes.includes(
          page
        )
      ) {
        sessionStorage.setItem(
          'portfolioRedirectPath',
          window.location.pathname +
          window.location.search +
          window.location.hash
        );

        window.location.replace('/');
      }
    }());
  </script>

  <main class="error-shell">
    <section class="error-card" aria-labelledby="errorTitle">
      <p class="error-code" aria-hidden="true">404</p>

      <div class="error-label">Route not found</div>

      <h1 class="error-title" id="errorTitle">
        This page went off-grid.
      </h1>

      <p class="error-message">
        The page you're looking for doesn't exist or may have moved.
        Head back to the portfolio and continue exploring.
      </p>

      <div class="error-actions">
        <a class="home-button" href="/about">
          <span>Back to Portfolio</span>
          <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
        </a>
      </div>
    </section>
  </main>

</body>
</html>
