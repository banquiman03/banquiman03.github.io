<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Manuel Banquiray III | Portfolio</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="assets/favicon.png"
  >


  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >


  <!-- Devicon -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
  >


  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- Custom CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>


  <!-- ==================================================
       MOBILE MENU BUTTON
  ================================================== -->

  <button
    class="mobile-menu-button"
    id="mobileMenuButton"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false"
    aria-controls="sidebar"
  >

    <i
      class="bi bi-list"
      id="mobileMenuIcon"
    ></i>

  </button>


  <!-- ==================================================
       MOBILE BACKDROP
  ================================================== -->

  <div
    class="mobile-menu-backdrop"
    id="mobileMenuBackdrop"
  ></div>


  <!-- ==================================================
       MAIN LAYOUT
  ================================================== -->

  <div class="portfolio-wrapper">


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >


      <!-- Profile Image -->

      <img
        src="assets/images/profile_2.jpg"
        alt="Manuel Banquiray III"
        class="profile-image"
      >


      <!-- Name -->

      <h1 class="profile-name">
        Manuel Banquiray III
      </h1>


      <!-- Badge -->

      <div class="role-badge-wrapper">

        <span class="role-badge">
          Front-End Developer & UI/UX Designer
        </span>

      </div>


      <!-- Contact & Social Links -->

      <div class="social-links">

        <a
          href="mailto:banquiman@gmail.com"
          class="social-link"
          aria-label="Email banquiman@gmail.com"
          title="Email"
        >

          <i class="bi bi-envelope"></i>

        </a>


        <a
          href="tel:+639666757898"
          class="social-link"
          aria-label="Call +63 966 675 7898"
          title="Phone"
        >

          <i class="bi bi-phone"></i>

        </a>


        <a
          href="https://www.facebook.com/Manbanqui03/"
          class="social-link"
          aria-label="Facebook"
          title="Facebook"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="bi bi-facebook"></i>

        </a>


        <a
          href="https://www.instagram.com/ohmygahd_tyler"
          class="social-link"
          aria-label="Instagram"
          title="Instagram"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="bi bi-instagram"></i>

        </a>


        <a
          href="https://www.linkedin.com/in/manuel-banquiray-iii/"
          class="social-link"
          aria-label="LinkedIn"
          title="LinkedIn"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="bi bi-linkedin"></i>

        </a>

      </div>


      <!-- ==================================================
           NAVIGATION
      ================================================== -->

      <nav class="sidebar-nav">


        <a
          href="about"
          class="nav-item-custom"
          data-page="about"
        >

          <span class="nav-icon">

            <i class="bi bi-person"></i>

          </span>

          <span>
            About
          </span>

        </a>


        <a
          href="resume"
          class="nav-item-custom"
          data-page="resume"
        >

          <span class="nav-icon">

            <i class="bi bi-file-earmark-text"></i>

          </span>

          <span>
            Resume
          </span>

        </a>


        <a
          href="portfolio"
          class="nav-item-custom"
          data-page="portfolio"
        >

          <span class="nav-icon">

            <i class="bi bi-briefcase"></i>

          </span>

          <span>
            Portfolio
          </span>

        </a>


        <a
          href="contact"
          class="nav-item-custom"
          data-page="contact"
        >

          <span class="nav-icon">

            <i class="bi bi-envelope"></i>

          </span>

          <span>
            Contact
          </span>

        </a>


      </nav>


    </aside>


    <!-- ==================================================
         DYNAMIC MAIN CONTENT

         pages/about.html
         pages/resume.html
         pages/portfolio.html
         pages/contact.html

         will be injected here.
    ================================================== -->

    <main
      class="main-content"
      id="mainContent"
      aria-live="polite"
    >

      <div class="page-loading">

        <div
          class="spinner-border text-primary"
          role="status"
        >

          <span class="visually-hidden">
            Loading...
          </span>

        </div>

      </div>

    </main>


  </div>


  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- Custom JS -->
  <script src="js/script.js"></script>


</body>

</html>
