<header class="page-header">

  <div class="page-title-wrapper">

    <span class="page-icon contact-page-icon">

      <svg
        class="contact-header-icon"
        viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >

        <path
          class="email-service-back-flap"
          d="M8 22 L20 11 C22.4 8.8 25.6 8.8 28 11 L40 22"
        ></path>

        <g class="contact-notification-content-card">

          <rect
            class="contact-notification-paper"
            x="13"
            y="10"
            width="22"
            height="22"
            rx="2.5"
          ></rect>

          <g class="contact-notification-bell">

            <path
              d="M19 25.5 C20 24.5 20.5 23.3 20.5 21.8 V19.5 C20.5 17.1 21.9 15.5 24 15.5 C26.1 15.5 27.5 17.1 27.5 19.5 V21.8 C27.5 23.3 28 24.5 29 25.5 Z"
            ></path>

            <path
              d="M22 27.2 C22.4 28.4 23.1 29 24 29 C24.9 29 25.6 28.4 26 27.2"
            ></path>

          </g>

        </g>

        <path
          class="email-service-envelope-outline"
          d="M8 22 V39 C8 41 9.5 42 11.5 42 H36.5 C38.5 42 40 41 40 39 V22"
        ></path>

        <path
          class="email-service-front-fold"
          d="M8 23 L22.5 34 L10 41"
        ></path>

        <path
          class="email-service-front-fold"
          d="M40 23 L25.5 34 L38 41"
        ></path>

        <path
          class="email-service-front-pocket"
          d="M9.5 41 L21 30.5 C22.7 29 25.3 29 27 30.5 L38.5 41"
        ></path>

      </svg>

    </span>

    <h1 class="page-title">
      Contact
    </h1>

  </div>

  <div class="page-divider"></div>

</header>


<div class="page-content contact-page-content">

  <section
    class="contact-map-section"
    aria-label="Location"
  >

    <div class="contact-map-wrapper">

      <iframe
        class="contact-map"
        src="https://www.google.com/maps?q=Dasmari%C3%B1as%2C%20Cavite%2C%20Philippines&output=embed"
        title="Dasmariñas, Cavite, Philippines"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>

    </div>

  </section>


  <section class="contact-form-section">

    <h2 class="contact-form-title">
      Contact Form
    </h2>

    <form
      class="contact-form"
      action="https://formspree.io/f/mljeevzg"
      method="POST"
      autocomplete="on"
    >

      <input
        class="contact-form-field"
        type="text"
        name="fullName"
        placeholder="Full Name"
        autocomplete="name"
        aria-label="Full Name"
        required
      >

      <input
        class="contact-form-field"
        type="email"
        name="email"
        placeholder="Email Address"
        autocomplete="email"
        aria-label="Email Address"
        required
      >

      <textarea
        class="contact-form-field contact-message"
        name="message"
        placeholder="Your Message"
        aria-label="Your Message"
        required
      ></textarea>

      <button
        class="contact-submit-button"
        type="submit"
      >
        <span>Send Message</span>
        <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
      </button>

      <p
        class="contact-form-status"
        role="status"
        aria-live="polite"
      ></p>

    </form>

  </section>

</div>
